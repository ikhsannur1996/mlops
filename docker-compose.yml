services:
  mlflow:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      # MLflow rejects Host headers outside this list (DNS rebinding guard).
      # Defaults cover localhost and private IPs; set it in .env when you
      # open the UI through a public IP, domain or forwarded port.
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS:-}
    command: >
      sh -c "pip install --no-cache-dir 'mlflow>=3.0,<4' &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root ./mlruns"
    ports:
      - "5000:5000"

  api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREDICTION_DB: /app/predictions.db
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
